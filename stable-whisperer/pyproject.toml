[project]
name = "stable-whisperer"
version = "0.1.0"
description = "Can we locally generate free real-time subtitle files on-demand? Let's find out!"
authors = [
    {name = "billyZduke",email = "billyzduke@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "stable-ts>=2.19.1",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "packaging (>=26.2,<27.0)",
    "demucs (>=4.0.1,<5.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false